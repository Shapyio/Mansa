name: Daily Scheduler Tick

# Once a day, hit POST /jobs/tick. The API enqueues rate-capped work; the
# worker container runs it. All limits live in scheduler_service.py.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC — gives FMP/Alpaca quotas time to reset
  workflow_dispatch:       # manual trigger
    inputs:
      metadata_budget:
        description: "Override FMP daily budget"
        required: false
      gap_budget:
        description: "Override Alpaca daily budget"
        required: false
      features_budget:
        description: "Override features daily budget"
        required: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /jobs/tick
        env:
          API_URL:          ${{ secrets.MANSA_API_URL }}
          API_TOKEN:        ${{ secrets.MANSA_API_TOKEN }}   # optional
          METADATA_BUDGET:  ${{ inputs.metadata_budget }}
          GAP_BUDGET:       ${{ inputs.gap_budget }}
          FEATURES_BUDGET:  ${{ inputs.features_budget }}
        run: |
          set -e
          BODY='{}'
          if [ -n "$METADATA_BUDGET" ] || [ -n "$GAP_BUDGET" ] || [ -n "$FEATURES_BUDGET" ]; then
            BODY=$(jq -n \
              --argjson m "${METADATA_BUDGET:-null}" \
              --argjson g "${GAP_BUDGET:-null}" \
              --argjson f "${FEATURES_BUDGET:-null}" \
              '{metadata_budget: $m, gap_budget: $g, features_budget: $f}')
          fi
          echo "Posting: $BODY"
          curl -fsS -X POST "$API_URL/jobs/tick" \
            -H "Content-Type: application/json" \
            ${API_TOKEN:+-H "Authorization: Bearer $API_TOKEN"} \
            -d "$BODY" | tee /tmp/resp.json
          jq . /tmp/resp.json
